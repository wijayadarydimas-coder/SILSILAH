<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="treeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Emblem Ring -->
  <circle cx="50" cy="50" r="46" fill="#0D1527" stroke="url(#treeGrad)" stroke-width="3" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="41" fill="none" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Roots -->
  <path d="M 50 72 L 50 82 M 50 76 L 38 84 M 50 76 L 62 84" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Trunk -->
  <path d="M 50 72 L 50 50" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>

  <!-- Branches -->
  <path d="M 50 56 Q 36 50 32 40" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 50 56 Q 64 50 68 40" stroke="#10B981" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M 50 50 L 50 30" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>

  <!-- Generation Nodes (Generations) -->
  <circle cx="50" cy="26" r="6" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="30" cy="38" r="5" fill="#3B82F6" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="70" cy="38" r="5" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.5"/>
  <circle cx="22" cy="52" r="4" fill="url(#goldGrad)"/>
  <circle cx="38" cy="54" r="4" fill="url(#goldGrad)"/>
  <circle cx="62" cy="54" r="4" fill="url(#goldGrad)"/>
  <circle cx="78" cy="52" r="4" fill="url(#goldGrad)"/>
</svg>
