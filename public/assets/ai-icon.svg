<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2" />
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Ring with Subtle Tech Dash -->
  <circle cx="50" cy="50" r="46" stroke="url(#aiGrad)" stroke-width="2.5" stroke-dasharray="12 4" opacity="0.6" />
  
  <!-- Core Background Bubble -->
  <circle cx="50" cy="50" r="40" fill="#0B132B" stroke="url(#aiGrad)" stroke-width="2" />
  <circle cx="50" cy="50" r="39" fill="url(#glowGrad)" opacity="0.15" />

  <!-- Genealogy Nodes & Intelligence Network -->
  <!-- Central Root Node (Pohon Silsilah) -->
  <circle cx="50" cy="36" r="8" fill="url(#aiGrad)" filter="url(#aiGlow)" />
  <circle cx="50" cy="36" r="4" fill="#FFFFFF" />

  <!-- Connecting Trunk & Branches -->
  <path d="M50 44 V 58 M50 58 L 33 70 M50 58 L 67 70" stroke="url(#aiGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Child / Descendant Nodes -->
  <circle cx="33" cy="70" r="6" fill="#10B981" />
  <circle cx="33" cy="70" r="2.5" fill="#FFFFFF" />

  <circle cx="67" cy="70" r="6" fill="#38BDF8" />
  <circle cx="67" cy="70" r="2.5" fill="#FFFFFF" />

  <!-- Sparkling AI Stars -->
  <!-- Top Right Sparkle -->
  <path d="M72 26 Q72 32 78 32 Q72 32 72 38 Q72 32 66 32 Q72 32 72 26 Z" fill="#FBBF24" />
  <!-- Bottom Left Sparkle -->
  <path d="M25 45 Q25 49 29 49 Q25 49 25 53 Q25 49 21 49 Q25 49 25 45 Z" fill="#34D399" opacity="0.9" />
</svg>
