<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" fill="none">
  <defs>
    <radialGradient id="bgVignette" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#191714" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#11100E" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B0A09" stop-opacity="1"/>
    </radialGradient>
    <pattern id="batikParangGrid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M0 120L120 0M-30 90L90 -30M30 150L150 30" stroke="#C6A15B" stroke-width="1" stroke-opacity="0.04" stroke-linecap="round"/>
      <circle cx="60" cy="60" r="14" stroke="#8F6D35" stroke-width="0.8" stroke-opacity="0.035" fill="none"/>
      <circle cx="60" cy="60" r="6" fill="#C6A15B" fill-opacity="0.03"/>
      <path d="M60 42C66 42 70 46 70 52C64 52 60 56 60 62C54 62 50 58 50 52C56 52 60 48 60 42Z" stroke="#C6A15B" stroke-width="0.8" stroke-opacity="0.04" fill="none"/>
    </pattern>
  </defs>
  <!-- Base Dark Canvas -->
  <rect width="100%" height="100%" fill="#11100E"/>
  <!-- Subtle Javanese Texture Layer -->
  <rect width="100%" height="100%" fill="url(#batikParangGrid)"/>
  <!-- Deep Vignette Layer to keep typography razor sharp -->
  <rect width="100%" height="100%" fill="url(#bgVignette)"/>
